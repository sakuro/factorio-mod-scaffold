name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

jobs:
  test:
    # A drift PR is opened with GITHUB_TOKEN and does not trigger workflows on its
    # own; adding the `run-ci` label opts it in. Other label events are inert.
    if: >-
      github.event.action != 'labeled' ||
      github.event.label.name == 'run-ci'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install build dependencies for Lua
      run: sudo apt-get update && sudo apt-get install -y libreadline-dev

    - name: Setup mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

    - name: Run tests
      run: mise run test
