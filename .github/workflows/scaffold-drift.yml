name: Scaffold Drift

# Weekly three-way merge of shared infrastructure from factorio-mod-scaffold.
# See CONTRIBUTING.md "Scaffold drift".

on:
  schedule:
    - cron: "30 18 * * 4"   # Fri 03:30 JST (Thu 18:30 UTC); same literal in every derived MOD
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Gate on API key
        id: gate
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "ANTHROPIC_API_KEY not configured - skipping (fork-safe no-op)." >&2
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect scaffold-side drift
        id: check
        if: steps.gate.outputs.proceed == 'true'
        run: |
          base=$(jq -r .commit .scaffold-sync.json)
          git clone --filter=blob:none --no-checkout \
            https://github.com/sakuro/factorio-mod-scaffold /tmp/scaffold
          mapfile -t globs < <(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' .scaffold-sync.paths)
          if git -C /tmp/scaffold diff --quiet "$base" origin/HEAD -- "${globs[@]}"; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve drift
        if: steps.gate.outputs.proceed == 'true' && steps.check.outputs.drift == 'true'
        uses: anthropics/claude-code-action@5ccc3a35a6367cdb8e6fbd0728287467540ecfe2 # v1.0.219
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: >
            Invoke the resolve-scaffold-drift skill. Open or update a PR on
            branch chore/scaffold-drift. Do nothing if there is no drift.
          claude_args: "--allowedTools Bash,Read,Edit,Write,Glob,Grep"
