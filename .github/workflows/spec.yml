name: Spec

# Part of the optional test lane: a MOD without `.busted` does not have this file.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  spec:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Install build dependencies for Lua
      run: sudo apt-get update && sudo apt-get install -y libreadline-dev

    - name: Setup mise
      uses: jdx/mise-action@v5.1.2

    - name: Run tests
      run: mise run test
