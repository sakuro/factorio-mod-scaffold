name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  format-check:
    runs-on: ubuntu-latest
    env:
      # stylua is a standalone binary; skip building Lua
      MISE_DISABLE_TOOLS: lua

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Setup mise
      uses: jdx/mise-action@v5.1.2

    - name: Check Lua formatting
      run: mise run format-check

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Install build dependencies for Lua
      run: sudo apt-get update && sudo apt-get install -y libreadline-dev

    - name: Setup mise
      uses: jdx/mise-action@v5.1.2

    - name: Lint Lua code
      run: mise run lint

    - name: Check function doc comments
      run: mise run doc-check

  verify-lockfile:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Install gh-actions-lock
      run: gh extension install github/gh-actions-lock --pin v0.4.0

    - name: Verify actions.lock
      run: gh actions-lock --verify
